[package]
name = "tm-metal"
version = "0.1.0"
edition = "2021"
autobins = false

[[bin]]
name = "tm-metal"
path = "src/main.rs"
test = false

[dev-dependencies]
serde_json = { version = "=1.0.116", features = ["arbitrary_precision"] }

[profile.release]
lto = "fat"
codegen-units = 1
overflow-checks = true
